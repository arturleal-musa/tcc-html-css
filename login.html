<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speed Zone</title>
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body class="login-page">
    <div class="login-shell">
      <a href="index.html"><img class="login-logo" src="img/logo.png" alt="Speed Zone" /></a>
      <h1 class="login-title">BEM-VINDO DE VOLTA</h1>
      <form class="login-form">
        <label class="login-label" for="email">EMAIL</label>
        <input class="login-input" type="email" id="email" name="email" placeholder="Digite seu email" />

        <label class="login-label" for="senha">SENHA</label>
        <input class="login-input" type="password" id="senha" name="senha" placeholder="Digite sua senha" />

        <a href="cadastro.html" class="login-link" href="#">AINDA NÃO TEM UMA CONTA? CLIQUE AQUI</a>

        <a href="index.html" class="login-button" type="submit">CONECTAR</a>
      </form>
      <p class="login-tagline">Se puder ser comparado, não é nosso</p>
    </div>
  </body>
</html>
