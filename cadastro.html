<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speed Zone</title>
    <link rel="stylesheet" href="css/cadastro.css" />
  </head>
  <body class="cadastro-page">
    <div class="cadastro-shell">
      <div class="cadastro-form">
        <p class="cadastro-legenda">INFORMAÇÕES DO CLIENTE</p>
        <label class="cadastro-label" for="nome">NOME COMPLETO</label>
        <input class="cadastro-input" type="text" id="nome" name="nome" placeholder="Digite seu nome completo" />

        <label class="cadastro-label" for="cpf">CPF</label>
        <input class="cadastro-input" type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" />

        <label class="cadastro-label" for="rg">RG</label>
        <input class="cadastro-input" type="text" id="rg" name="rg" placeholder="Digite seu RG" />

        <label class="cadastro-label" for="nascimento">DATA DE NASCIMENTO</label>
        <input class="cadastro-input" type="date" id="nascimento" name="nascimento" />

        <label class="cadastro-label" for="telefone">TELEFONE</label>
        <input class="cadastro-input" type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" />

        <a href="endereco.html"><button class="cadastro-button" type="submit">CONTINUAR</button></a>
      </div>

      <div class="cadastro-brand">
        <img class="img-cadastro" src="img/logo.png" alt="Speed Zone" />
      </div>
    </div>

    <p class="cadastro-tagline">Se puder ser comparado, não é nosso</p>
    <script src="js/no-status.js"></script>
  </body>
</html>
