<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speed Zone</title>
    <link rel="stylesheet" href="css/endereco.css" />
  </head>
  <body class="endereco-page">
    <div class="endereco-shell">
      <div class="endereco-form">
        <p class="endereco-legenda">INFORMAÇÕES DE REGISTRO</p>

        <label class="endereco-label" for="reg-email">EMAIL</label>
        <input class="endereco-input" type="email" id="reg-email" name="reg-email" placeholder="Digite seu email" />

        <label class="endereco-label" for="reg-senha">SENHA</label>
        <input class="endereco-input" type="password" id="reg-senha" name="reg-senha" placeholder="Digite sua senha" />

        <label class="endereco-label" for="reg-senha-conf">CONFIRME A SENHA</label>
        <input class="endereco-input" type="password" id="reg-senha-conf" name="reg-senha-conf" placeholder="Confirme a senha" />

        <div class="endereco-actions">
          <a href="endereco.html" class="endereco-button">VOLTAR</a>
          <a href="login.html" class="endereco-button" type="submit">CONTINUAR</a>
        </div>
      </div>

      <div class="endereco-brand">
        <img src="img/logo.png" alt="Speed Zone" />
      </div>
    </div>

    <p class="endereco-tagline">Se puder ser comparado, não é nosso</p>
  </body>
</html>
