<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speed Zone</title>
    <link rel="stylesheet" href="css/endereco.css" />
  </head>
  <body class="endereco-page">
    <div class="endereco-shell">
      <div class="endereco-form">
        <p class="endereco-legenda">INFORMAÇÕES DE ENDEREÇO</p>

        <label class="endereco-label" for="cep">CEP</label>
        <input class="endereco-input" type="text" id="cep" name="cep" placeholder="Digite seu CEP" />

        <label class="endereco-label" for="rua">RUA</label>
        <input class="endereco-input" type="text" id="rua" name="rua" placeholder="Digite sua rua" />

        <label class="endereco-label" for="numero">NÚMERO</label>
        <input class="endereco-input" type="text" id="numero" name="numero" placeholder="Número" />

        <label class="endereco-label" for="complemento">COMPLEMENTO</label>
        <input class="endereco-input" type="text" id="complemento" name="complemento" placeholder="Apartamento, bloco, etc." />

        <div class="endereco-actions">
          <a href="cadastro.html" class="endereco-button">VOLTAR</a>
          <a href="registro.html"class="endereco-button" type="submit">CONTINUAR</a>
        </div>
      </div>

      <div class="endereco-brand">
        <img src="img/logo.png" alt="Speed Zone" />
      </div>
    </div>

    <p class="endereco-tagline">Se puder ser comparado, não é nosso</p>
  </body>
</html>
